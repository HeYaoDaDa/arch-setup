---
- name: Full setup (all steps + cleanup)
  hosts: all
  connection: local
  become: yes
  vars_files:
    - ../vars/secrets.yml

  tasks:
    - name: Install packages
      import_tasks: ../tasks/packages.yml
      tags: [packages]

    - name: System configuration
      import_tasks: ../tasks/system.yml
      tags: [system]

    - name: Deploy dotfiles
      import_tasks: ../tasks/dotfiles.yml
      become: yes
      become_user: "{{ user_name }}"
      tags: [dotfiles]

    - name: Load airport subscription URL
      include_vars:
        file: "../host_vars/{{ inventory_hostname }}/airport_subscription_url.vault.yml"
      when: inventory_hostname in groups['routers'] | default([])
      tags: [fusiontunx, proxy]

    - name: Setup FusionTunX proxy
      import_tasks: ../tasks/fusiontunx.yml
      when: inventory_hostname in groups['routers'] | default([])
      tags: [fusiontunx, proxy]

    - name: Cleanup
      command: pacman -Sc --noconfirm
      changed_when: false
      tags: [cleanup]

    - name: Done
      debug:
        msg: |
          +-------------------------------------------+
          | [OK] {{ hostname }} setup complete!        |
          |                                           |
          | Reboot to apply all changes.              |
          +-------------------------------------------+

  handlers:
    - name: restart systemd-networkd
      systemd:
        name: systemd-networkd
        state: restarted

    - name: restart iwd
      systemd:
        name: iwd
        state: restarted

    - name: restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted

    - name: restart systemd-logind
      systemd:
        name: systemd-logind
        state: restarted

    - name: restart fusiontunx
      systemd:
        name: fusiontunx
        state: restarted
        daemon_reload: yes
