---
# ─── 新软路由独有配置（替换现有 Debian 软路由） ───

hostname: laptop-router-arch-x201e

# 网络（替换原 192.168.10.2 软路由）
network_interface: enp2s0
static_ip: 192.168.10.2
gateway: 192.168.10.1
netmask: 24

# 笔记本专用包
packages_extra: []

# 笔记本专用服务
services_extra: []

# SSH 端口转发（外网 → ASUS 公网 1811 → 本机 → 目标机器 22）
ssh_forward_port: 1811
ssh_forward_target: 192.168.10.25
ssh_forward_target_port: 22

# 无 WiFi（x201e 没有无线网卡）

# 合盖行为（无头模式，合盖不影响运行）
lid_close_action: ignore
